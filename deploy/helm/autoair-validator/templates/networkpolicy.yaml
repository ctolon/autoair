{{- if .Values.networkPolicy.enabled }}
# Ingress only from the AutoAir callers (and the metrics scraper); no egress at all, DNS
# included, unless networkPolicy.egress lists rules: the validator needs no network, and DAG
# code it imports must not reach any. A release that only serves test runs
# (validator.run_url) may allow the egress its task tests need.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "autoair-validator.name" . }}
  labels:
    {{- include "autoair-validator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "autoair-validator.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.allowFrom | nindent 8 }}
        {{- with .Values.networkPolicy.allowMetricsFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: {{ .Values.port }}
          protocol: TCP
  {{- with .Values.networkPolicy.egress }}
  egress:
    {{- toYaml . | nindent 4 }}
  {{- else }}
  egress: []
  {{- end }}
{{- end }}
