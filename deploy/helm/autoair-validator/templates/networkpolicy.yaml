{{- if .Values.networkPolicy.enabled }}
# Ingress only from the AutoAir callers (and the metrics scraper); no egress at all, DNS
# included: the validator needs no network, and DAG code it imports must not reach any.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "autoair-validator.name" . }}
  labels:
    {{- include "autoair-validator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "autoair-validator.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.allowFrom | nindent 8 }}
        {{- with .Values.networkPolicy.allowMetricsFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: {{ .Values.port }}
          protocol: TCP
  egress: []
{{- end }}
