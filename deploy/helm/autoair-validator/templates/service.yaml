apiVersion: v1
kind: Service
metadata:
  name: {{ include "autoair-validator.name" . }}
  labels:
    {{- include "autoair-validator.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "autoair-validator.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
      protocol: TCP
