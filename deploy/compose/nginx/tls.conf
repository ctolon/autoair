# Profile tls: TLS termination with the demo CA (certs-init).
#   :8443 -> both AutoAir replicas (HTTPS in front of plain-HTTP replicas, X-Forwarded-Proto)
#   :9443 -> the Airflow api-server (so autoair-tls reaches Airflow over verified HTTPS)
upstream autoair { server autoair-a:8765; server autoair-b:8765; keepalive 16; }
upstream airflow { server airflow-apiserver:8080; keepalive 16; }

map $http_upgrade $connection_upgrade { default upgrade; '' ''; }

ssl_certificate     /etc/nginx/certs/server.pem;
ssl_certificate_key /etc/nginx/certs/server.key;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_session_cache   shared:SSL:1m;

server {
    listen 8443 ssl;
    http2 on;
    client_max_body_size 16m;
    location / {
        proxy_pass http://autoair;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_buffering off;
    }
}

server {
    listen 9443 ssl;
    client_max_body_size 16m;
    location / {
        proxy_pass http://airflow;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 10m;
    }
}

server {
    listen 8081;
    location = /healthz { return 200 "ok\n"; }
}
