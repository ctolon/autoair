# Profile lb: round-robin over both AutoAir replicas. No sticky sessions are needed because
# state and collaboration rooms are shared through PostgreSQL (or Redis with profile redis).
upstream autoair {
    server autoair-a:8765 max_fails=3 fail_timeout=10s;
    server autoair-b:8765 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 8080;
    client_max_body_size 16m;              # = AUTOAIR_SERVER__MAX_BODY_BYTES

    # Which replica answered (handy when testing failover / collaboration fan-out).
    add_header X-Upstream $upstream_addr always;

    location / {
        proxy_pass http://autoair;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSockets: /api/collab/... (co-editing) and /api/lsp/... (language servers)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;             # long-lived WebSockets and AI streams
        proxy_buffering off;               # server-sent events (AI streaming)
    }
}

server {
    listen 8081;
    location = /healthz { return 200 "ok\n"; }
}
