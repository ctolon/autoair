# Single-container dev setup: Airflow standalone + AutoAir plugin, DAGs on a volume.
#   make build && docker compose -f deploy/compose/docker-compose.yaml up --build
services:
  airflow:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    command: standalone
    ports: ["8080:8080"]
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"   # development only
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "5"
      AUTOAIR_STORAGE__MODE: local
      AUTOAIR_ENVIRONMENTS: '["dev","prod"]'
    volumes:
      - dags:/opt/airflow/dags
volumes:
  dags: {}
