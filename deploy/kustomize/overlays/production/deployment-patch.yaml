apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoair
spec:
  template:
    spec:
      containers:
        - name: autoair
          env:
            # Collaboration tickets must verify on every replica; without it each pod
            # derives its own key.
            - name: AUTOAIR_COLLAB_SECRET
              valueFrom:
                secretKeyRef:
                  name: autoair-collab
                  key: secret
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 2Gi
