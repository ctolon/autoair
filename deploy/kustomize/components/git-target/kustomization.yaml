# Deploy target git: AutoAir commits specs and generated DAG files to a repository (pull
# request per DAG by default) that Airflow's GitDagBundle reads. The pods then need no
# volume for DAGs.
#
# Credentials are an Airflow connection, given to the pods as AIRFLOW_CONN_GIT_DAGS from
# the Secret autoair-git (or served by an Airflow secrets backend instead):
#   kubectl -n autoair create secret generic autoair-git --from-literal=connection=\
#     '{"conn_type": "git", "host": "https://github.com/acme/airflow-dags.git",
#       "login": "x-access-token", "password": "<fine-grained token>"}'
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

configMapGenerator:
  - name: autoair-config
    behavior: merge
    envs:
      - settings.env

patches:
  - path: deployment-patch.yaml
