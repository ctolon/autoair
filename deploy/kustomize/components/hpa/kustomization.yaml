# Scale `autoair serve` on CPU and memory between 2 and 6 pods. Requires PostgreSQL state
# (components/postgresql) and the metrics server. The Deployment's own replica count is
# removed, so `kubectl apply` does not reset what the autoscaler chose.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - hpa.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: autoair
    patch: |-
      - op: remove
        path: /spec/replicas
