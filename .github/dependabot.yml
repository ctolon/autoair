# Weekly dependency updates, grouped so a week produces a handful of pull requests.
version: 2
updates:
  - package-ecosystem: github-actions
    open-pull-requests-limit: 0   # paused until v0.1.0 ships; remove to resume
    directory: /
    schedule: {interval: weekly, day: monday}
    groups:
      actions:
        patterns: ["*"]
    commit-message: {prefix: "ci"}

  - package-ecosystem: uv
    open-pull-requests-limit: 0   # paused until v0.1.0 ships; remove to resume
    directory: /
    schedule: {interval: weekly, day: monday}
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Airflow majors are a deliberate compatibility decision (requires apache-airflow<4).
      - dependency-name: apache-airflow
        update-types: [version-update:semver-major]
    commit-message: {prefix: "deps"}

  - package-ecosystem: npm
    open-pull-requests-limit: 0   # paused until v0.1.0 ships; remove to resume
    directory: /frontend
    schedule: {interval: weekly, day: monday}
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
    commit-message: {prefix: "deps(frontend)"}

  - package-ecosystem: npm
    open-pull-requests-limit: 0   # paused until v0.1.0 ships; remove to resume
    directory: /website
    schedule: {interval: weekly, day: monday}
    groups:
      website-minor-patch:
        update-types: [minor, patch]
    commit-message: {prefix: "deps(website)"}

  - package-ecosystem: docker
    open-pull-requests-limit: 0   # paused until v0.1.0 ships; remove to resume
    directories: [/deploy/docker]
    schedule: {interval: weekly, day: monday}
    ignore:
      # The Airflow base image follows the supported Airflow line, bumped by hand.
      - dependency-name: apache/airflow
        update-types: [version-update:semver-major]
    commit-message: {prefix: "deps(docker)"}

  - package-ecosystem: docker-compose
    open-pull-requests-limit: 0   # paused until v0.1.0 ships; remove to resume
    directories: [/deploy/compose]
    schedule: {interval: monthly}
    commit-message: {prefix: "deps(compose)"}
